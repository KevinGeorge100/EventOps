# ─── EventOps Docker Compose ──────────────────────────────
# Single-command orchestration for the EventOps ecosystem
# ─────────────────────────────────────────────────────────

version: '3.8'

services:
  eventops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventops-app
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-eventops-docker-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-eventops2024}
      - COOKIE_SECURE=false
    volumes:
      # Persist event data across container restarts
      - eventops-data:/app/data
      # Persist user uploads (banners)
      - eventops-uploads:/app/src/public/uploads
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - eventops-network

volumes:
  eventops-data:
    driver: local
  eventops-uploads:
    driver: local

networks:
  eventops-network:
    driver: bridge
